    var itemsHtml = "";
    if (items && items.length) {
      itemsHtml = '<div style="margin-top:6px;font-size:11px;opacity:.9;line-height:1.6">' + items.map(function (t) { return "· " + t; }).join("<br/>") + "</div>";
    }
    b.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:space-between"><span style="font-weight:700">새 버전이 나왔어요</span><button style="background:#fff;color:#2F6B4F;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;flex-shrink:0;margin-left:8px">업데이트</button></div>' +
      itemsHtml;
    b.querySelector("button").onclick = function () {
      location.href = location.pathname + "?v=" + Date.now();
    };
    document.body.appendChild(b);
  }
  function check() {
    if (checking) return;
    checking = true;
    lastCheck = Date.now();
    fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store", headers: { Range: "bytes=0-2047" } })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var m = t.match(/name="app-version" content="([^"]+)"/);
        if (m && m[1] !== current) {
          var cl = t.match(/name="app-changelog" content="([^"]*)"/);
          var items = cl ? cl[1].split("|").filter(Boolean) : [];
          showBanner(items);
        }
      })
      .catch(function () {})
      .then(function () { checking = false; });
  }
  window.addEventListener("load", check);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && Date.now() - lastCheck > 20 * 60 * 1000) check();
  });
})();

function LayeredAvatar({ gender, hairId, outfitId, expression, stageId = 0, size = 120, glow }) {
  const g = gender === "female" ? "female" : "male";
  const hasCrown = stageId >= 6;

  // 여성: 헤어+옷 조합 완성본 이미지 사용(표정은 고정 기본 표정)
  if (g === "female") {
    const hair = hairId || defaultHair(g);
    const outfit = outfitId || defaultOutfit(g);
    const combo = (FEMALE_COMBOS[hair] && FEMALE_COMBOS[hair][outfit]) || FEMALE_COMBOS[defaultHair(g)][defaultOutfit(g)];
    const RATIO_F = 320 / 256;
    return (
      <div style={{ position: "relative", display: "inline-block", width: size, height: size * RATIO_F, filter: glow ? "drop-shadow(0 0 12px #2F6B4F99)" : "none", transition: "filter 0.4s ease" }}>
        <img src={combo} alt="" style={{ position: "absolute", left: 0, top: 0, width: "100%", height: "100%", display: "block" }} />
        {hasCrown && (
          <div style={{ position: "absolute", top: "-9%", left: "50%", transform: "translateX(-50%)", fontSize: size * 0.22 }}>👑</div>
        )}
      </div>
    );
  }

  // 남성: 2026년 10월 초 원본 단일 이미지 1종으로 복원(표정 변화 없음)
  const RATIO = 513 / 320;
  return (
    <div style={{ position: "relative", display: "inline-block", width: size, height: size * RATIO, filter: glow ? "drop-shadow(0 0 12px #2F6B4F99)" : "none", transition: "filter 0.4s ease" }}>
      <img src={MALE_IMAGE} alt="" style={{ position: "absolute", left: 0, top: 0, width: "100%", height: "100%", display: "block" }} />
      {hasCrown && (
        <div style={{ position: "absolute", top: "-9%", left: "50%", transform: "translateX(-50%)", fontSize: size * 0.22 }}>👑</div>
      )}
    </div>
  );
}

function monthsBetweenDates(startStr, endStr) {
  if (!startStr) return 0;
  const start = new Date(startStr);
  const end = endStr ? new Date(endStr) : new Date();
  let months = (end.getFullYear() - start.getFullYear()) * 12 + (end.getMonth() - start.getMonth());
  if (end.getDate() < start.getDate()) months -= 1;
  return Math.max(0, months);
}
function daysBetweenDates(startStr, endStr) {
  if (!startStr) return 0;
  const start = new Date(startStr);
  const end = endStr ? new Date(endStr) : new Date();
  return Math.max(0, Math.floor((end - start) / (1000 * 60 * 60 * 24)));
}
function getStageByMonths(months) {
  let current = STAGES[0];
  for (const s of STAGES) if (months >= s.minMonths) current = s;
  return current;
}
function nextStage(stageId) {
  return STAGES.find((s) => s.id === stageId + 1) || null;
}
function formatKRW(n) {
  if (!n && n !== 0) return "-";
  return Math.round(n).toLocaleString("ko-KR") + "원";
}
function ddayDiff(dateStr) {
  const target = new Date(dateStr + "T00:00:00");
  const now = new Date();
  const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - todayMidnight) / (1000 * 60 * 60 * 24));
}
// 여러 점을 지나는 부드러운 S자 곡선 SVG path 생성 (Catmull-Rom → Cubic Bezier)
// 마인크래프트 느낌의 블록형 빌딩 아이콘
// 홈 로드맵의 먼 스카이라인 실루엣 (결정론적 시드 기반 배치)
function generateSkyline(seed, count, minH, maxH, roadW = 300) {
  let s = seed;
  const rand = () => {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    return (s % 1000) / 1000;
  };
  const blocks = [];
  let x = -10;
  while (x < roadW + 10) {
    const w = 16 + Math.floor(rand() * 16);
    const h = minH + Math.floor(rand() * (maxH - minH));
    const hasAntenna = rand() > 0.72;
    const hasCap = rand() > 0.5;
    // 창문 격자 (일부만 점등)
    const wins = [];
    const rows = Math.max(1, Math.floor((h - 10) / 10));
    const cols = Math.max(1, Math.floor((w - 6) / 7));
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (rand() > 0.4) wins.push({ dx: 3 + c * 7, dy: 6 + r * 10 });
      }
    }
    blocks.push({ x, w, h, hasAntenna, hasCap, wins });
    x += w + Math.floor(rand() * 4);
  }
  return blocks;
}
const SKYLINE_FAR = generateSkyline(11, 14, 40, 110);
const SKYLINE_NEAR = generateSkyline(27, 10, 60, 150);

function BlockBuilding({ w = 26, h = 44, paletteIdx = 0, lit = true }) {
  const p = BUILDING_PALETTES[paletteIdx % BUILDING_PALETTES.length];
  const sideW = Math.round(w * 0.32);
  const frontW = w - sideW;
  const rows = Math.max(2, Math.floor((h - 8) / 9));
  const windows = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < 2; c++) {
      windows.push(
        <rect key={`${r}-${c}`} x={4 + c * (frontW - 10)} y={8 + r * 9} width={4} height={4} fill={lit ? p.win : p.side} opacity={lit ? 0.95 : 0.4} />
      );
    }
  }
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <rect x="0" y="4" width={frontW} height={h - 4} fill={p.main} />
      <rect x={frontW} y="8" width={sideW} height={h - 8} fill={p.side} />
      <rect x="0" y="0" width={frontW} height="6" fill={p.roof} />
      {windows}
    </svg>
  );
}

function smoothPath(points) {
  if (points.length < 2) return "";
  let d = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i - 1] || points[i];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = points[i + 2] || p2;
    const c1x = p1.x + (p2.x - p0.x) / 6;
    const c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6;
    const c2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d;
}

function ddayLabel(diff) {
  if (diff === 0) return "D-DAY";
  if (diff > 0) return `D-${diff}`;
  return `D+${Math.abs(diff)}`;
}

const DAY_PILLAR_EPOCH = Date.UTC(1911, 7, 25); // 1911-08-25 = 정묘일(N=3)

function dayPillarIndex(dateStr) {
  const d = new Date(dateStr + "T00:00:00Z");
  const diffDays = Math.round((Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - DAY_PILLAR_EPOCH) / 86400000);
  return (((diffDays + 3) % 60) + 60) % 60;
}
function pillarFromIndex(n) {
  const stem = STEMS[n % 10];
  const branch = BRANCHES[n % 12];
  return { stem, branch, label: stem.ch + branch.ch };
}
function getDayPillar(dateStr) {
  return pillarFromIndex(dayPillarIndex(dateStr));
}
function getYearBranch(birthDateStr) {
  const d = new Date(birthDateStr + "T00:00:00");
  let year = d.getFullYear();
  // 입춘(2/4) 이전 출생은 전년도로 계산 (근사치)
  if (d.getMonth() === 0 || (d.getMonth() === 1 && d.getDate() < 4)) year -= 1;
  const idx = (((year - 1984) % 12) + 12) % 12; // 1984 = 갑자년(자, 쥐띠)
  return BRANCHES[idx];
}

function getTodayFortune(profile) {
  if (!profile || !profile.birthDate) return null;
  const todayStr = dateKeyOf(new Date());
  const myPillar = getDayPillar(profile.birthDate);
  const todayPillar = getDayPillar(todayStr);
  const relation = getElementRelation(myPillar.stem.element, todayPillar.stem.element);
  const yearBranch = getYearBranch(profile.birthDate);
  return {
    todayStr,
    myPillar,
    todayPillar,
    relation,
    yearBranch,
    messages: FORTUNE_MESSAGES[relation],
  };
}

function totalCareerMonths(profile, careerHistory) {
  const past = careerHistory.reduce((sum, c) => sum + monthsBetweenDates(c.startDate, c.endDate), 0);
  const current = profile ? monthsBetweenDates(profile.joinDate, null) : 0;
  return past + current;
}

// 고용노동부 평균임금 산정 방식
// 1일 평균임금 = (퇴직전 3개월 임금총액) / (그 3개월간 총 일수)
// 임금총액 = 3개월 기본급 + (연간상여금 x 3/12) + (연간연차수당 x 3/12)
// 퇴직금 = 1일 평균임금 x 30 x (재직일수 / 365)
function calcSeverance({ joinDate, monthlySalary, annualBonus = 0, annualLeavePay = 0, targetDate }) {
  if (!joinDate || !monthlySalary) return { severance: 0, avgDailyWage: 0, threeMonthDays: 0, workDays: 0 };

  const end = targetDate ? new Date(targetDate + "T00:00:00") : new Date();
  const threeMonthsAgo = new Date(end);
  threeMonthsAgo.setMonth(threeMonthsAgo.getMonth() - 3);

  const threeMonthDays = Math.max(1, Math.round((end - threeMonthsAgo) / (1000 * 60 * 60 * 24)));
  const totalWage = monthlySalary * 3 + (annualBonus * 3) / 12 + (annualLeavePay * 3) / 12;
  const avgDailyWage = totalWage / threeMonthDays;

  const workDays = Math.max(0, Math.floor((end - new Date(joinDate + "T00:00:00")) / (1000 * 60 * 60 * 24)));
  const severance = avgDailyWage * 30 * (workDays / 365);

  return { severance, avgDailyWage, threeMonthDays, workDays };
}

    saveAll({ ddays: [...ddays, { id: Date.now(), ...d }] });
    setShowDdayModal(false);
    setPendingCalDate(null);
    showToast("디데이가 추가되었습니다 📌");
  };

  const removeDday = (id) => {
    saveAll({ ddays: ddays.filter((d) => d.id !== id) });
  };

  const addLeave = (entry) => {
    saveAll({ leaves: [...leaves, { id: Date.now(), ...entry }] });
    setShowLeaveModal(false);
    setPendingCalDate(null);
    showToast(`${leaveLabel(entry)} 등록 완료`);
  };
  const removeLeave = (id) => {
    saveAll({ leaves: leaves.filter((l) => l.id !== id) });
  };
  const addGrants = (list) => {
    const base = Date.now();
    saveAll({ leaveGrants: [...leaveGrants, ...list.map((g, i) => ({ id: base + i, ...g }))] });
    setShowGrantModal(false);
    showToast(list.length > 1 ? `${list.length}건 부여 등록 완료` : "부여 등록 완료");
  };
  const removeGrant = (id) => {
    saveAll({ leaveGrants: leaveGrants.filter((g) => g.id !== id) });
  };

  const saveCustomize = ({ gender, hairStyle, outfit }) => {
    const genderChanged = gender !== profile.gender;
    saveAll({ profile: { ...profile, gender, hairStyle, outfit } });
    showToast(genderChanged ? (gender === "female" ? "여성 캐릭터로 변경했어요" : "남성 캐릭터로 변경했어요") : "캐릭터를 저장했어요");
  };

  if (!loaded) {
    return (
      <div className="app-wrap" style={S.loadingScreen}>
        <style>{FONT_IMPORT}</style>
        <div style={{ fontFamily: "var(--font-main)", color: "#2F6B4F", fontSize: 13 }}>불러오는 중...</div>
      </div>
    );
  }

  const phoneFrameStyle = IS_STANDALONE
    ? { borderRadius: 0, border: "none", boxShadow: "none" }
    : { borderRadius: 28, border: "1px solid var(--border)", boxShadow: "0 30px 60px -20px rgba(0,0,0,0.6)" };

  return (
    <div className="app-wrap" style={{ ...S.phoneWrap, background: THEME_BG.day, padding: IS_STANDALONE ? 0 : "18px 0" }}>
      <style>{FONT_IMPORT}</style>
      {!IS_STANDALONE && <div style={S.dayDecor}>☀️</div>}
      <div className="app-wrap" style={{ ...S.phone, ...THEME_VARS.day, ...phoneFrameStyle }}>
        {showOnboard && introPhase === "welcome" && <WelcomeScreen onStart={() => setIntroPhase("walking")} />}
        {showOnboard && introPhase === "walking" && <WalkInAnimation onComplete={() => setIntroPhase("onboard")} />}
        {showOnboard && introPhase === "onboard" && <OnboardScreen onSubmit={handleOnboardSubmit} />}

        {!showOnboard && profile && (
          <>
            <Header profile={profile} stage={stage} totalMonths={totalMonths} onCustomize={() => setShowCustomize(true)} onOpenDetail={() => setShowCharacterDetail(true)} />

            <div style={S.content}>
              {tab === "home" && (
                <HomeTab
                  profile={profile}
                  stage={stage}
                  careerHistory={careerHistory}
                  totalMonths={totalMonths}
                  onAddChapter={() => setShowChapterModal(true)}
                  onRemoveChapter={removeChapter}
                  onEditChapter={(c) => setEditingChapter(c)}
                  onEditCurrent={() => setEditingCurrent(true)}
                />
              )}
              {tab === "calendar" && (
                <CalendarTab
                  events={events}
                  ddays={ddays}
                  ddaysWithDiff={ddaysWithDiff}
                  onAddEvent={() => {
                    setPendingCalDate(null);
                    setShowEventModal(true);
                  }}
                  onAddDday={() => {
                    setPendingCalDate(null);
                    setShowDdayModal(true);
                  }}
                  onAddEventForDate={(d) => {
                    setPendingCalDate(d);
                    setShowEventModal(true);
                  }}
                  onAddDdayForDate={(d) => {
                    setPendingCalDate(d);
                    setShowDdayModal(true);
                  }}
                  onRemoveDday={removeDday}
                  leaves={leaves}
                  leaveGrants={leaveGrants}
                  onAddLeave={() => {
                    setPendingCalDate(null);
                    setShowLeaveModal(true);
                  }}
                  onAddLeaveForDate={(d) => {
                    setPendingCalDate(d);
                    setShowLeaveModal(true);
                  }}
                  onAddGrant={() => setShowGrantModal(true)}
                  onRemoveLeave={removeLeave}
                  onRemoveGrant={removeGrant}
                />
              )}
              {tab === "fortune" && (
                <FortuneTab profile={profile} onUpdateProfile={(patch) => saveAll({ profile: { ...profile, ...patch } })} />
              )}
              {tab === "severance" && (
                <SeveranceTab
                  profile={profile}
                  onUpdateProfile={(patch) => saveAll({ profile: { ...profile, ...patch } })}
                />
              )}
              {tab === "diary" && <DiaryTab diary={diary} onAdd={() => setShowDiaryModal(true)} />}
            </div>

            <BottomNav tab={tab} setTab={setTab} />
          </>
        )}

        {showCharacterDetail && (
          <CharacterDetailModal
            profile={profile}
            stage={stage}
            upcoming={upcoming}
            progressPct={progressPct}
            totalMonths={totalMonths}
            joyRatio={joyRatio}
            totalMood={totalMood}
            nearestDday={nearestDday}
            onClose={() => setShowCharacterDetail(false)}
            onOpenChangelog={() => setShowChangelog(true)}
          />
        )}
        {showCustomize && <CustomizeModal profile={profile} onClose={() => setShowCustomize(false)} onSave={saveCustomize} />}
        {showChangelog && <ChangelogModal onClose={() => setShowChangelog(false)} />}
        {showDiaryModal && <DiaryModal onClose={() => setShowDiaryModal(false)} onSubmit={addDiaryEntry} />}
        {showEventModal && (
          <EventModal
            onClose={() => {
              setShowEventModal(false);
              setPendingCalDate(null);
            }}
            onSubmit={addEvent}
            defaultDate={pendingCalDate}
          />
        )}
        {showChapterModal && (
          <ChapterModal onClose={() => setShowChapterModal(false)} onSubmit={addChapter} careerHistory={careerHistory} currentJoinDate={profile?.joinDate} />
        )}
        {editingChapter && (
          <ChapterModal key={editingChapter.id} initial={editingChapter} onClose={() => setEditingChapter(null)} onSubmit={updateChapter} careerHistory={careerHistory} currentJoinDate={profile?.joinDate} />
        )}
        {editingCurrent && (
          <CurrentJobModal onClose={() => setEditingCurrent(false)} onSubmit={updateCurrent} initialCompany={profile.company} initialJoinDate={profile.joinDate} careerHistory={careerHistory} />
        )}
        {showDdayModal && (
          <DdayModal
            onClose={() => {
              setShowDdayModal(false);
              setPendingCalDate(null);
            }}
            onSubmit={addDday}
            defaultDate={pendingCalDate}
          />
        )}

        {showLeaveModal && (
          <LeaveModal
            onClose={() => {
              setShowLeaveModal(false);
              setPendingCalDate(null);
            }}
            onSubmit={addLeave}
            defaultDate={pendingCalDate}
            leaves={leaves}
            balance={calcLeaveBalance(leaves, leaveGrants, dateKeyOf(new Date()))}
          />
        )}
        {showGrantModal && <GrantModal onClose={() => setShowGrantModal(false)} onSubmit={addGrants} />}

        {notices.length > 0 && !showOnboard && <NoticeModal key={notices[0].key} notice={notices[0]} remaining={notices.length - 1} onClose={() => setNotices((prev) => prev.slice(1))} />}

        {toast && <div style={S.toast}>{toast}</div>}
      </div>
    </div>
  );
}

}

function NumericDateInput({ value, onChange }) {
  const initial = value ? value.split("-") : ["", "", ""];
  const [y, setY] = useState(initial[0] || "");
  const [m, setM] = useState(initial[1] || "");
  const [d, setD] = useState(initial[2] || "");

  const emit = (ny, nm, nd) => {
    if (ny && ny.length === 4 && nm && nd) {
      onChange(`${ny}-${String(nm).padStart(2, "0")}-${String(nd).padStart(2, "0")}`);
    } else {
      onChange("");
    }
  };

  return (
    <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
      <input
        type="number"
        placeholder="YYYY"
        value={y}
        onChange={(e) => {
          const v = e.target.value.slice(0, 4);
          setY(v);
          emit(v, m, d);
        }}
        style={{ ...S.input, width: 68, textAlign: "center", padding: "10px 4px" }}
      />
      <span style={{ fontSize: 11, color: "var(--text-tertiary)" }}>년</span>
      <input
        type="number"
        placeholder="MM"
        value={m}
        onChange={(e) => {
          let v = e.target.value.slice(0, 2);
          if (v && Number(v) > 12) v = "12";
          setM(v);
          emit(y, v, d);
        }}
        style={{ ...S.input, width: 50, textAlign: "center", padding: "10px 4px" }}
      />
      <span style={{ fontSize: 11, color: "var(--text-tertiary)" }}>월</span>
      <input
        type="number"
        placeholder="DD"
        value={d}
        onChange={(e) => {
          let v = e.target.value.slice(0, 2);
          if (v && Number(v) > 31) v = "31";
          setD(v);
          emit(y, m, v);
        }}
        style={{ ...S.input, width: 50, textAlign: "center", padding: "10px 4px" }}
      />
      <span style={{ fontSize: 11, color: "var(--text-tertiary)" }}>일</span>
    </div>
  );
}

// ---------- 커리어 탭 (챕터) ----------
// ---------- 홈 탭 (경력별 맵) ----------
// ---------- 캘린더 탭 (이벤트/디데이/공휴일 한눈에) ----------
function pad2(n) {
  return String(n).padStart(2, "0");
}
// ---------- 휴가 · 연차 ----------
const LEAVE_CATEGORIES = [
  { id: "annual", label: "연차", emoji: "🏖️", deduct: true },
  { id: "comp", label: "대휴", emoji: "🔄", deduct: true },
  { id: "condolence", label: "경조휴가", emoji: "🕊️", deduct: false },
  { id: "etc", label: "기타 휴가", emoji: "📌", deduct: false },
];
const LEAVE_UNITS = [
  { id: "full", label: "연차 (1일)", short: "연차", value: 1 },
  { id: "half", label: "반차 (0.5일)", short: "반차", value: 0.5 },
  { id: "quarter", label: "반반차 (0.25일)", short: "반반차", value: 0.25 },
];
const LEAVE_COLOR = "#9C6ADE";

function dateKeyOf(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function parseKey(k) {
  const [y, m, d] = k.split("-").map(Number);
  return new Date(y, m - 1, d);
}
// 시작~종료 날짜 목록 (weekdaysOnly면 주말·공휴일 제외)
function expandLeaveDates(start, end, weekdaysOnly) {
  const out = [];
  const cur = parseKey(start);
  const last = parseKey(end);
  let guard = 0;
  while (cur <= last && guard < 120) {
    const k = dateKeyOf(cur);
    const wd = cur.getDay();
    if (!weekdaysOnly || (wd !== 0 && wd !== 6 && !HOLIDAYS_KR[k])) out.push(k);
    cur.setDate(cur.getDate() + 1);
    guard++;
  }
  return out;
}
function addMonthsKey(k, n) {
  const [y, m, d] = k.split("-").map(Number);
  const dt = new Date(y, m - 1 + n, 1);
  const last = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
  dt.setDate(Math.min(d, last));
  return dateKeyOf(dt);
}
function fmtDays(n) {
  return `${Number((Math.round(n * 100) / 100).toFixed(2))}일`;
}
function leavePer(l) {
  return (LEAVE_UNITS.find((u) => u.id === l.unit) || LEAVE_UNITS[0]).value;
}
function leaveLabel(l) {
  const cat = LEAVE_CATEGORIES.find((c) => c.id === l.category) || LEAVE_CATEGORIES[3];
  if (!cat.deduct) return cat.label;
  const u = LEAVE_UNITS.find((x) => x.id === l.unit) || LEAVE_UNITS[0];
  if (cat.id === "annual") return u.short;
  return u.id === "full" ? cat.label : `${cat.label} ${u.short}`;
}
function calcLeaveBalance(leaves, grants, todayKey) {
  const res = {
    annual: { granted: 0, used: 0, planned: 0, remain: 0 },
    comp: { granted: 0, used: 0, planned: 0, remain: 0 },
  };
  grants.forEach((g) => {
    if (res[g.kind] && g.date <= todayKey) res[g.kind].granted += Number(g.days) || 0;
  });
  leaves.forEach((l) => {
    if (!res[l.category]) return;
    const per = leavePer(l);
    l.dates.forEach((k) => {
      if (k <= todayKey) res[l.category].used += per;
      else res[l.category].planned += per;
    });
  });
  Object.keys(res).forEach((k) => {
    res[k].remain = res[k].granted - res[k].used - res[k].planned;
  });
  return res;
}

function LeaveModal({ onClose, onSubmit, defaultDate, leaves, balance }) {
  const today = dateKeyOf(new Date());
  const [category, setCategory] = useState("annual");
  const [unit, setUnit] = useState("full");
  const [startDate, setStartDate] = useState(defaultDate || today);
  const [endDate, setEndDate] = useState(defaultDate || today);
  const [note, setNote] = useState("");
  const [error, setError] = useState("");

  const cat = LEAVE_CATEGORIES.find((c) => c.id === category);
  const isDeduct = cat.deduct;
  const effUnit = isDeduct ? unit : "full";
  const ranged = effUnit === "full";
  const per = LEAVE_UNITS.find((u) => u.id === effUnit).value;
  const end = ranged ? endDate || startDate : startDate;
  const dates = startDate && end && startDate <= end ? expandLeaveDates(startDate, end, isDeduct) : [];
  const amount = isDeduct ? dates.length * per : dates.length;
  const remain = isDeduct ? balance[category].remain : null;

  const submit = () => {
    if (!startDate) return setError("날짜를 입력해 주세요");
    if (end < startDate) return setError("종료일이 시작일보다 빨라요");
    if (dates.length === 0) return setError("주말·공휴일이라 등록할 날이 없어요");
    const perDay = {};
    leaves.forEach((l) => {
      const p = leavePer(l);
      l.dates.forEach((k) => {
        perDay[k] = (perDay[k] || 0) + p;
      });
    });
    const conflict = dates.find((k) => (perDay[k] || 0) + per > 1.0001);
    if (conflict) return setError(`${Number(conflict.slice(5, 7))}월 ${Number(conflict.slice(8, 10))}일에 이미 등록된 휴가와 합쳐서 1일을 넘어요`);
    onSubmit({ category, unit: effUnit, dates, note });
  };

  return (
    <div style={S.modalOverlay}>
      <div style={S.modalSheet}>
        <div style={S.modalHeaderRow}>
          <span style={S.modalTitle}>휴가 등록</span>
          <button style={S.iconBtn} onClick={onClose}>
            <X size={16} color="var(--text-secondary)" />
          </button>
        </div>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 10 }}>
          {LEAVE_CATEGORIES.map((c) => (
            <button
              key={c.id}
              onClick={() => {
                setCategory(c.id);
                setError("");
              }}
              style={{ ...S.moodChip, borderColor: category === c.id ? LEAVE_COLOR : "var(--border-strong)", background: category === c.id ? `${LEAVE_COLOR}22` : "transparent" }}
            >
              {c.emoji} {c.label}
            </button>
          ))}
        </div>

        {isDeduct && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 4 }}>
            {LEAVE_UNITS.map((u) => (
              <button
                key={u.id}
                onClick={() => {
                  setUnit(u.id);
                  setError("");
                }}
                style={{ ...S.moodChip, borderColor: unit === u.id ? "#2F6B4F" : "var(--border-strong)", background: unit === u.id ? "#2F6B4F22" : "transparent" }}
              >
                {category === "comp" && u.id === "full" ? "종일 (1일)" : u.label}
              </button>
            ))}
          </div>
        )}

        <label style={S.label}>{ranged ? "시작일" : "날짜"}</label>
        <NumericDateInput
          value={startDate}
          onChange={(v) => {
            setStartDate(v);
            setError("");
          }}
        />
        {ranged && (
          <>
            <label style={S.label}>종료일 (하루면 시작일과 같게)</label>
            <NumericDateInput
              value={endDate}
              onChange={(v) => {
                setEndDate(v);
                setError("");
              }}
            />
          </>
        )}

        <label style={S.label}>메모 (선택)</label>
        <input style={S.input} placeholder="예: 가족 여행" value={note} onChange={(e) => setNote(e.target.value)} />

        <div style={{ fontSize: 10, color: "var(--text-secondary)", marginTop: 10, lineHeight: 1.6 }}>
          {isDeduct ? (
            <>
              {dates.length > 0 ? `${dates.length}일 × ${per}일 = ${fmtDays(amount)} 사용` : "사용 일수가 계산되지 않았어요"} (주말·공휴일은 자동 제외)
              <br />
              현재 잔여 {fmtDays(remain)} → 등록 후{" "}
              <span style={{ color: remain - amount < 0 ? "#D9714E" : "#2F6B4F", fontWeight: 700 }}>{fmtDays(remain - amount)}</span>
              {remain - amount < 0 ? " (잔여가 부족해요)" : ""}
            </>
          ) : (
            <>{dates.length}일 기록 (주말 포함 기간 전체 · 연차에서 차감되지 않아요)</>
          )}
        </div>

        {error && <div style={S.errorText}>⚠️ {error}</div>}
        <button style={{ ...S.primaryBtn, marginTop: 14 }} onClick={submit}>
          등록
        </button>
      </div>
    </div>
  );
}

          }}
        />

        <label style={S.label}>매월 반복 (개월 수)</label>
        <input style={S.input} type="number" min="1" max="24" value={repeat} onChange={(e) => setRepeat(e.target.value)} />
        <div style={{ fontSize: 10, color: "var(--text-tertiary)", marginTop: 4, lineHeight: 1.5 }}>월차처럼 매월 같은 날 부여되면 개월 수를 넣으세요. 예: 부여일 2026-01-15, 일수 1, 11개월 → 매월 15일 +1일씩 11번 등록</div>

        <label style={S.label}>메모 (선택)</label>
        <input style={S.input} placeholder="예: 2026년 연차 부여" value={note} onChange={(e) => setNote(e.target.value)} />

        {error && <div style={S.errorText}>⚠️ {error}</div>}
        <button style={{ ...S.primaryBtn, marginTop: 14 }} onClick={submit}>
          등록
        </button>
      </div>
    </div>
  );
}

function CalendarTab({ events, ddays, ddaysWithDiff, onAddEvent, onAddDday, onAddEventForDate, onAddDdayForDate, onRemoveDday, leaves = [], leaveGrants = [], onAddLeave, onAddLeaveForDate, onAddGrant, onRemoveLeave, onRemoveGrant }) {
  const [viewDate, setViewDate] = useState(new Date());
  const [selectedDate, setSelectedDate] = useState(null);
  const [showAllItems, setShowAllItems] = useState(false);
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth(); // 0-indexed

  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const eventsByDate = {};
  events.forEach((e) => {
    const k = e.date.slice(0, 10);
    (eventsByDate[k] = eventsByDate[k] || []).push(e);
  });
  const ddaysByDate = {};
  ddays.forEach((d) => {
    (ddaysByDate[d.date] = ddaysByDate[d.date] || []).push(d);
  });

  const todayKey = dateKeyOf(new Date());

  const leavesByDate = {};
  leaves.forEach((l) =>
    l.dates.forEach((k) => {
      (leavesByDate[k] = leavesByDate[k] || []).push(l);
    })
  );
  const balance = calcLeaveBalance(leaves, leaveGrants, todayKey);
  const shortMD = (k) => `${Number(k.slice(5, 7))}/${Number(k.slice(8, 10))}`;
  const history = [
    ...leaves.map((l) => ({ kind: "leave", id: l.id, sortKey: l.dates[0] || "", l })),
    ...leaveGrants.map((g) => ({ kind: "grant", id: g.id, sortKey: g.date, g })),
  ]
    .sort((a, b) => b.sortKey.localeCompare(a.sortKey))
    .slice(0, 8);

  const nowD = new Date();
  const viewingCurrentMonth = year === nowD.getFullYear() && month === nowD.getMonth();
  const monthItems = [];
  cells.forEach((day) => {
    if (!day) return;
    const key = `${year}-${pad2(month + 1)}-${pad2(day)}`;
    if (viewingCurrentMonth && key < todayKey) return; // 이번 달은 오늘 이후 일정만
    if (HOLIDAYS_KR[key]) monthItems.push({ day, type: "holiday", label: HOLIDAYS_KR[key] });
    (eventsByDate[key] || []).forEach((e) => monthItems.push({ day, type: "event", label: e.typeLabel, emoji: e.emoji }));
    (ddaysByDate[key] || []).forEach((d) => {
      const cat = DDAY_CATEGORIES.find((c) => c.id === d.category) || DDAY_OTHER;
      monthItems.push({ day, type: "dday", label: d.title, emoji: cat.emoji });
    });
    (leavesByDate[key] || []).forEach((l) => {
      const lc = LEAVE_CATEGORIES.find((c) => c.id === l.category) || LEAVE_CATEGORIES[3];
      monthItems.push({ day, type: "leave", label: `${leaveLabel(l)}${l.note ? ` · ${l.note}` : ""}`, emoji: lc.emoji });
    });
    leaveGrants
      .filter((g) => g.date === key)
      .forEach((g) => {
        monthItems.push({ day, type: "grant", label: `${g.kind === "comp" ? "대휴" : "연차·월차"} ${Number(g.days) > 0 ? "+" : ""}${fmtDays(Number(g.days))} 부여`, emoji: "🎁" });
      });
  });
  // 가까운 날짜 순, 같은 날이면 연휴 > 일정 > 디데이 > 휴가 순
  const typeRank = { holiday: 0, event: 1, dday: 2, leave: 3, grant: 3 };
  monthItems.sort((a, b) => a.day - b.day || typeRank[a.type] - typeRank[b.type]);
  const LIST_LIMIT = 5;
  const visibleItems = showAllItems ? monthItems : monthItems.slice(0, LIST_LIMIT);

  return (
    <div style={S.tabContent}>
      <div style={S.card}>
        <div style={S.cardRowBetween}>
          <button style={S.iconBtn} onClick={() => setViewDate(new Date(year, month - 1, 1))}>
            <ChevronLeft size={16} color="var(--text-secondary)" />
          </button>
          <span style={{ fontFamily: "var(--font-main)", fontSize: 14, color: "var(--text-primary)", fontWeight: 700 }}>
            {year}년 {month + 1}월
          </span>
          <button style={S.iconBtn} onClick={() => setViewDate(new Date(year, month + 1, 1))}>
            <ChevronRight size={16} color="var(--text-secondary)" />
          </button>
        </div>

        <div style={S.calWeekRow}>
          {["일", "월", "화", "수", "목", "금", "토"].map((w, i) => (
            <div key={w} style={{ ...S.calWeekLabel, color: i === 0 ? "#D9714E" : i === 6 ? "#4FA5C4" : "var(--text-tertiary)" }}>
              {w}
            </div>
          ))}
        </div>

        <div style={S.calGrid}>
          {cells.map((day, idx) => {
            if (!day) return <div key={idx} />;
            const key = `${year}-${pad2(month + 1)}-${pad2(day)}`;
            const holiday = HOLIDAYS_KR[key];
            const hasEvent = !!eventsByDate[key];
            const hasDday = !!ddaysByDate[key];
            const hasLeave = !!leavesByDate[key];
            const weekday = idx % 7;
            const isToday = key === todayKey;
            const isSelected = key === selectedDate;
            const numColor = holiday || weekday === 0 ? "#D9714E" : weekday === 6 ? "#4FA5C4" : "var(--text-primary)";
            return (
              <div
                key={idx}
                onClick={() => setSelectedDate(isSelected ? null : key)}
                style={{
                  ...S.calCell,
                  cursor: "pointer",
                  background: isSelected ? "#4FA5C433" : isToday ? "#2F6B4F22" : "transparent",
                  border: isSelected ? "1px solid #4FA5C4" : isToday ? "1px solid #2F6B4F" : "1px solid transparent",
                }}
              >
                <span style={{ fontSize: 11, color: numColor, fontWeight: holiday ? 700 : 400 }}>{day}</span>
                <div style={{ display: "flex", gap: 2, marginTop: 2 }}>
                  {holiday && <div style={{ ...S.calDot, background: "#D9714E" }} />}
                  {hasEvent && <div style={{ ...S.calDot, background: "#2F6B4F" }} />}
                  {hasDday && <div style={{ ...S.calDot, background: "#4FA5C4" }} />}
                  {hasLeave && <div style={{ ...S.calDot, background: LEAVE_COLOR }} />}
                </div>
              </div>
            );
          })}
        </div>

        {selectedDate && (
          <div style={{ ...S.calSelectBar, flexWrap: "wrap", gap: 8 }}>
            <span style={{ fontSize: 11, color: "var(--text-primary)", fontFamily: "var(--font-main)" }}>
              {Number(selectedDate.slice(5, 7))}월 {Number(selectedDate.slice(8, 10))}일에 등록
            </span>
            <div style={{ display: "flex", gap: 6 }}>
              <button
                style={S.smallAddBtn}
                onClick={() => {
                  onAddEventForDate(selectedDate);
                  setSelectedDate(null);
                }}
              >
                + 이벤트
              </button>
              <button
                style={{ ...S.smallAddBtn, color: "#4FA5C4", background: "#4FA5C418", border: "1px solid #4FA5C440" }}

                  onAddDdayForDate(selectedDate);
                  setSelectedDate(null);
                }}
              >
                + 디데이
              </button>
              <button
                style={{ ...S.smallAddBtn, color: LEAVE_COLOR, background: `${LEAVE_COLOR}18`, border: `1px solid ${LEAVE_COLOR}40` }}
                onClick={() => {
                  onAddLeaveForDate(selectedDate);
                  setSelectedDate(null);
                }}
              >
                + 휴가
              </button>
            </div>
          </div>
        )}

        <div style={{ display: "flex", gap: 12, marginTop: 10, justifyContent: "center" }}>
          <div style={S.calLegendItem}>
            <div style={{ ...S.calDot, background: "#D9714E" }} /> <span style={S.calLegendText}>공휴일</span>
          </div>
          <div style={S.calLegendItem}>
            <div style={{ ...S.calDot, background: "#2F6B4F" }} /> <span style={S.calLegendText}>이벤트</span>
          </div>
          <div style={S.calLegendItem}>
            <div style={{ ...S.calDot, background: "#4FA5C4" }} /> <span style={S.calLegendText}>디데이</span>
          </div>
          <div style={S.calLegendItem}>
            <div style={{ ...S.calDot, background: LEAVE_COLOR }} /> <span style={S.calLegendText}>휴가</span>
          </div>
        </div>
      </div>

      <div style={S.card}>
        <span style={S.cardLabel}>{viewingCurrentMonth ? "이번 달 일정" : `${month + 1}월 일정`}</span>
        {viewingCurrentMonth && <div style={{ fontSize: 9, color: "var(--text-tertiary)", marginTop: 2 }}>오늘 이후 일정만 가까운 순으로 보여요</div>}
        {monthItems.length === 0 ? (
          <div style={S.emptyText}>{viewingCurrentMonth ? "남은 이벤트·디데이·휴가·공휴일이 없어요" : "이 달엔 등록된 이벤트·디데이·휴가·공휴일이 없어요"}</div>
        ) : (
          <div style={{ marginTop: 8 }}>
            {visibleItems.map((it, idx) => (
              <div key={idx} style={S.eventRow}>
                <span style={{ fontSize: 14 }}>{it.type === "holiday" ? holidayEmoji(it.label) : it.emoji}</span>
                <div style={{ marginLeft: 8, flex: 1 }}>
                  <div style={{ fontSize: 12, color: "var(--text-primary)" }}>{it.label}</div>
                </div>
                <span style={{ fontSize: 9, color: "var(--text-tertiary)" }}>
                  {month + 1}월 {it.day}일
                </span>
              </div>
            ))}
            {monthItems.length > LIST_LIMIT && (
              <button style={{ ...S.linkBtn, display: "block", margin: "8px auto 0" }} onClick={() => setShowAllItems(!showAllItems)}>
                {showAllItems ? "접기" : `더보기 (+${monthItems.length - LIST_LIMIT}개)`}
              </button>
            )}
          </div>
        )}
      </div>

      <div style={S.card}>
        <div style={S.cardRowBetween}>
          <span style={S.cardLabel}>휴가 · 연차</span>
          <div style={{ display: "flex", gap: 6 }}>
            <button style={S.smallAddBtn} onClick={onAddGrant}>
              <Plus size={10} strokeWidth={3} /> 부여
            </button>
            <button style={{ ...S.smallAddBtn, color: LEAVE_COLOR, background: `${LEAVE_COLOR}18`, border: `1px solid ${LEAVE_COLOR}40` }} onClick={onAddLeave}>
              <Plus size={10} strokeWidth={3} /> 등록
            </button>
          </div>
        </div>

        {[
          ["annual", "연차 · 월차"],
          ["comp", "대휴"],
        ].map(([k, title]) => {
          const b = balance[k];
          if (k === "comp" && !(b.granted || b.used || b.planned)) return null;
          return (
            <div key={k} style={{ marginTop: 10 }}>
              <div style={{ fontSize: 10, color: "var(--text-secondary)", marginBottom: 4 }}>{title}</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6 }}>
                {[
                  ["부여", b.granted],
                  ["사용", b.used],
                  ["예정", b.planned],
                  ["잔여", b.remain],
                ].map(([label, v]) => (
                  <div key={label} style={{ background: "var(--bg-recessed)", borderRadius: 10, padding: "8px 2px", textAlign: "center" }}>
                    <div style={{ fontSize: 9, color: "var(--text-tertiary)" }}>{label}</div>
                    <div style={{ fontSize: 12, fontWeight: 700, marginTop: 2, fontFamily: "var(--font-main)", color: label === "잔여" ? (v < 0 ? "#D9714E" : "#2F6B4F") : "var(--text-primary)" }}>{fmtDays(v)}</div>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
        <div style={{ fontSize: 9, color: "var(--text-tertiary)", marginTop: 8, lineHeight: 1.5 }}>부여 일수는 회사 규정대로 직접 입력해요. 부여일이 지나면 잔여에 반영되고, 오늘 이후로 등록한 휴가는 "예정"으로 미리 차감돼요.</div>

        {history.length === 0 ? (
          <div style={S.emptyText}>먼저 "부여"로 받은 연차 일수를 입력하고, 쓴 휴가는 "등록"으로 기록해 보세요</div>
        ) : (
          <div style={{ marginTop: 10 }}>
            <div style={{ fontSize: 10, color: "var(--text-secondary)", marginBottom: 2 }}>최근 내역</div>
            {history.map((h) => {
              if (h.kind === "leave") {
                const l = h.l;
                const lc = LEAVE_CATEGORIES.find((c) => c.id === l.category) || LEAVE_CATEGORIES[3];
                const first = l.dates[0];
                const last = l.dates[l.dates.length - 1];
                const amountText = lc.deduct ? `-${fmtDays(leavePer(l) * l.dates.length)}` : `${l.dates.length}일`;
                return (
                  <div key={`l${l.id}`} style={S.eventRow}>
                    <span style={{ fontSize: 14 }}>{lc.emoji}</span>
                    <div style={{ marginLeft: 8, flex: 1 }}>
                      <div style={{ fontSize: 12, color: "var(--text-primary)" }}>
                        {leaveLabel(l)}
                        {l.note ? ` · ${l.note}` : ""}
                      </div>
                      <div style={{ fontSize: 10, color: "var(--text-tertiary)" }}>{l.dates.length > 1 ? `${shortMD(first)} ~ ${shortMD(last)}` : shortMD(first)}</div>
                    </div>
                    <span style={{ fontSize: 11, color: LEAVE_COLOR, fontFamily: "var(--font-main)", marginRight: 8 }}>{amountText}</span>
                    <button style={S.iconBtn} onClick={() => onRemoveLeave(l.id)}>
                      <Trash2 size={12} color="var(--text-quaternary)" />
                    </button>
                  </div>
                );
              }
              const g = h.g;
              const gd = Number(g.days);
              return (
                <div key={`g${g.id}`} style={S.eventRow}>
                  <span style={{ fontSize: 14 }}>🎁</span>
                  <div style={{ marginLeft: 8, flex: 1 }}>
                    <div style={{ fontSize: 12, color: "var(--text-primary)" }}>
                      {g.kind === "comp" ? "대휴" : "연차 · 월차"} 부여{g.note ? ` · ${g.note}` : ""}
                    </div>
                    <div style={{ fontSize: 10, color: "var(--text-tertiary)" }}>{shortMD(g.date)}</div>
                  </div>
                  <span style={{ fontSize: 11, color: gd < 0 ? "#D9714E" : "#2F6B4F", fontFamily: "var(--font-main)", marginRight: 8 }}>
                    {gd > 0 ? "+" : ""}
                    {fmtDays(gd)}
                  </span>
                  <button style={S.iconBtn} onClick={() => onRemoveGrant(g.id)}>
                    <Trash2 size={12} color="var(--text-quaternary)" />
                  </button>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div style={S.card}>
        <div style={S.cardRowBetween}>
          <span style={S.cardLabel}>이벤트 타임라인</span>
          <button style={S.smallAddBtn} onClick={onAddEvent}>
            <Plus size={10} strokeWidth={3} /> 등록
          </button>
        </div>
        {events.length === 0 ? (
          <div style={S.emptyText}>승진, 프로젝트 완료 같은 특별한 순간을 기록해보세요</div>
        ) : (
          <div style={{ marginTop: 8 }}>
            {events.slice(0, 6).map((ev) => (
              <div key={ev.id} style={S.eventRow}>
                <span style={{ fontSize: 14 }}>{ev.emoji}</span>
                <div style={{ marginLeft: 8, flex: 1 }}>
                  <div style={{ fontSize: 12, color: "var(--text-primary)" }}>{ev.typeLabel}</div>
                  {ev.note ? <div style={{ fontSize: 10, color: "var(--text-tertiary)" }}>{ev.note}</div> : null}
                </div>
                <span style={{ fontSize: 9, color: "var(--text-tertiary)" }}>{new Date(ev.date).toLocaleDateString("ko-KR", { month: "short", day: "numeric" })}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={S.card}>
        <div style={S.cardRowBetween}>
          <span style={S.cardLabel}>디데이</span>
          <button style={S.smallAddBtn} onClick={onAddDday}>
            <Plus size={10} strokeWidth={3} /> 등록
          </button>
        </div>
        {ddaysWithDiff.length === 0 ? (
          <div style={S.emptyText}>퇴사, 여행, 휴직처럼 기다려지는 날을 등록해보세요</div>
        ) : (
          <div style={{ marginTop: 8 }}>
            {ddaysWithDiff.map((d) => {
              const cat = DDAY_CATEGORIES.find((c) => c.id === d.category) || DDAY_OTHER;
              const passed = d.diff < 0;
              return (
                <div key={d.id} style={{ ...S.eventRow, opacity: passed ? 0.5 : 1 }}>
                  <span style={{ fontSize: 14 }}>{cat.emoji}</span>
                  <div style={{ marginLeft: 8, flex: 1 }}>
                    <div style={{ fontSize: 12, color: "var(--text-primary)" }}>{d.title}</div>
                    <div style={{ fontSize: 10, color: "var(--text-tertiary)" }}>{d.date}</div>
                  </div>
                  <span style={{ fontSize: 11, color: passed ? "var(--text-quaternary)" : "#2F6B4F", fontFamily: "var(--font-main)", marginRight: 8 }}>{ddayLabel(d.diff)}</span>
                  <button style={S.iconBtn} onClick={() => onRemoveDday(d.id)}>
                    <Trash2 size={12} color="var(--text-quaternary)" />
                  </button>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function HomeTab({ profile, stage, careerHistory, totalMonths, onAddChapter, onRemoveChapter, onEditChapter, onEditCurrent }) {
  const TOTAL_SLOTS = 10;
  const [selectedId, setSelectedId] = useState(null);
  const years = Math.floor(totalMonths / 12);
  const months = totalMonths % 12;

  const past = [...careerHistory].sort((a, b) => new Date(a.startDate) - new Date(b.startDate));
  const realStops = [
    ...past.map((c) => ({ id: c.id, company: c.company, period: `${c.startDate} ~ ${c.endDate}`, startDate: c.startDate, endDate: c.endDate })),
    { id: "current", company: profile.company, period: `${profile.joinDate} ~ 현재`, startDate: profile.joinDate, current: true },
  ].slice(0, TOTAL_SLOTS);
  const currentIndex = realStops.length - 1;

  const slots = Array.from({ length: TOTAL_SLOTS }, (_, i) => (i < realStops.length ? { ...realStops[i], filled: true } : { id: `empty-${i}`, filled: false }));

  const ROAD_W = 300;
  const SKY_H = 220; // 배경 도시가 차지하는 상단~중간 영역
  const ROW_TOP_Y = SKY_H + 44;
  const ROW_BOTTOM_Y = SKY_H + 140;
  const BOTTOM_PAD = 36;
  const height = ROW_BOTTOM_Y + BOTTOM_PAD;
  const MARGIN_X = 34;
  const COLS5 = [MARGIN_X, MARGIN_X + (ROAD_W - 2 * MARGIN_X) * 0.25, ROAD_W / 2, ROAD_W - MARGIN_X - (ROAD_W - 2 * MARGIN_X) * 0.25, ROAD_W - MARGIN_X];
  // ㄷ자(180도 턴) 형태: 위쪽 줄 좌→우, 오른쪽에서 꺾어 아래쪽 줄 우→좌
  const SLOT_LAYOUT = [
    { x: COLS5[0], y: ROW_TOP_Y },
    { x: COLS5[1], y: ROW_TOP_Y },
    { x: COLS5[2], y: ROW_TOP_Y },
    { x: COLS5[3], y: ROW_TOP_Y },
    { x: COLS5[4], y: ROW_TOP_Y },
    { x: COLS5[4], y: ROW_BOTTOM_Y },
    { x: COLS5[3], y: ROW_BOTTOM_Y },
    { x: COLS5[2], y: ROW_BOTTOM_Y },
    { x: COLS5[1], y: ROW_BOTTOM_Y },
    { x: COLS5[0], y: ROW_BOTTOM_Y },
  ];

  const points = slots.map((s, i) => ({
    ...s,
    x: SLOT_LAYOUT[i].x,
    y: SLOT_LAYOUT[i].y,
  }));

  // Catmull-Rom → Cubic Bezier 변환으로 점들을 부드럽게 연결 (ㄷ자 180도 턴)
  const pathD = smoothPath(points);

  const selected = points.find((p) => p.id === selectedId && p.filled);
  const selectedDur = selected && !selected.current ? monthsBetweenDates(selected.startDate, selected.endDate) : null;
  const selectedIdx = selected ? points.findIndex((p) => p.id === selected.id) : -1;

  return (
    <div style={S.tabContent}>
      <div style={{ textAlign: "center", marginBottom: 2 }}>
        <div style={{ fontFamily: "var(--font-main)", fontSize: 14, color: "var(--text-primary)", fontWeight: 700 }}>{profile.name}님의 커리어 로드</div>
        <div style={{ fontSize: 10, color: "var(--text-tertiary)", marginTop: 4 }}>
          최대 10개 회사까지 · 지금은 {currentIndex + 1}번째 회사예요
        </div>
      </div>

      <div style={S.card}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
          <Briefcase size={16} color="#2F6B4F" />
          <span style={S.cardLabel}>총 경력</span>
        </div>
        <div style={{ fontFamily: "var(--font-main)", fontSize: 22, color: "#2F6B4F", textAlign: "center", padding: "10px 0" }}>

function daysBetweenKeys(fromKey, toKey) {
  return Math.round((parseKey(toKey) - parseKey(fromKey)) / 86400000);
}
function shouldCare(diary, log, todayKey) {
  if (diary.length < CARE_MIN_ENTRIES) return false;
  const neg = diary.filter((d) => NEGATIVE_MOODS.includes(d.mood)).length;
  if (neg / diary.length < CARE_RATIO) return false;
  if (log.careLast && daysBetweenKeys(log.careLast, todayKey) < CARE_COOLDOWN_DAYS) return false;
  return true;
}
function buildCareNotice() {
  return {
    key: "care",
    emoji: "🤍",
    title: "요즘 마음이 많이 무거웠죠",
    body: CARE_MESSAGES[Math.floor(Math.random() * CARE_MESSAGES.length)],
    footnote: "마음이 계속 무겁다면 혼자 견디지 말고 꼭 이야기해 주세요.\n정신건강위기상담 1577-0199 · 자살예방상담 109 (24시간)",
    button: "고마워요",
  };
}
function buildDdayNotice(d) {
  const preset = DDAY_CELEBRATION[d.category] || DDAY_CELEBRATION.etc;
  const fill = (s) => s.split("{title}").join(d.title);
  const custom = (d.message || "").trim();
  return { key: `dday-${d.id}`, emoji: preset.emoji, title: fill(preset.title), body: custom || fill(preset.body), confetti: true, button: "고마워요" };
}
function rebaseNoticeLog(prof, history, todayKey) {
  const log = { ...(prof.noticeLog || {}) };
  log.careerYears = Math.floor(totalCareerMonths(prof, history) / 12);
  log.joinYears = Math.floor(monthsBetweenDates(prof.joinDate, todayKey) / 12);
  return { ...prof, noticeLog: log };
}
// 앱을 열 때 보여줄 알림 모으기: 근속 기념 → 디데이 당일 → 위로
function collectNotices({ profile, ddays, diary, totalMonths, log, today }) {
  const notices = [];
  const next = { ...log, dday: { ...(log.dday || {}) } };

  const careerYears = Math.floor(totalMonths / 12);
  const joinYears = Math.floor(monthsBetweenDates(profile.joinDate, today) / 12);
  let careerN = 0;
  let joinN = 0;
  if (next.careerYears === undefined || careerYears < next.careerYears) next.careerYears = careerYears;
  else if (careerYears > next.careerYears) {
    careerN = careerYears;
    next.careerYears = careerYears;
  }
  if (next.joinYears === undefined || joinYears < next.joinYears) next.joinYears = joinYears;
  else if (joinYears > next.joinYears) {
    joinN = joinYears;
    next.joinYears = joinYears;
  }
  const stageName = getStageByMonths(totalMonths).name;
  if (careerN && joinN && careerN === joinN) {
    notices.push({
      key: `both-${joinN}`,
      emoji: "🎊",
      title: `입사 ${joinN}주년 · 총 경력 ${careerN}년!`,
      body: `${profile.company}에서 ${joinN}년, 그리고 사회생활 ${careerN}년째.\n하루하루 이겨낸 시간이 이렇게 쌓였어요. 정말 대단해요! 스스로를 마음껏 축하해 주세요.`,
      footnote: `현재 성장 단계: ${stageName}`,
      confetti: true,
      button: "고마워요",
    });
  } else {
    if (joinN) {
      notices.push({
        key: `join-${joinN}`,
        emoji: "🥳",
        title: `입사 ${joinN}주년을 축하해요!`,
        body: JOIN_YEAR_MESSAGES[joinN % JOIN_YEAR_MESSAGES.length].split("{N}").join(joinN).split("{company}").join(profile.company),
        confetti: true,
        button: "고마워요",
      });
    }
    if (careerN) {
      notices.push({
        key: `career-${careerN}`,
        emoji: "🎊",
        title: `총 경력 ${careerN}년 달성!`,
        body: CAREER_YEAR_MESSAGES[careerN % CAREER_YEAR_MESSAGES.length].split("{N}").join(careerN),
        footnote: `현재 성장 단계: ${stageName}`,
        confetti: true,
        button: "고마워요",
      });
    }
  }

  ddays.forEach((d) => {
    if (d.date === today && next.dday[d.id] !== today) {
      notices.push(buildDdayNotice(d));
      next.dday[d.id] = today;
    }
  });
  Object.keys(next.dday).forEach((id) => {
    if (!ddays.some((d) => String(d.id) === String(id))) delete next.dday[id];
  });

  if (shouldCare(diary, next, today)) {
    notices.push(buildCareNotice());
    next.careLast = today;
  }
  return { notices, log: next };
}

function ConfettiBurst({ count = 48 }) {
  const pieces = useMemo(() => {
    const colors = ["#2F6B4F", "#4FA5C4", "#F4C95D", "#E88FA0", "#9C6ADE", "#7FB77E", "#FFFFFF"];
    return Array.from({ length: count }, (_, i) => {
      const round = Math.random() > 0.6;
      const size = 6 + Math.random() * 6;
      return {
        left: Math.random() * 100,
        delay: Math.random() * 0.9,
        dur: 2.4 + Math.random() * 1.6,
        w: size,
        h: round ? size : size * 1.6,
        color: colors[i % colors.length],
        rot: Math.floor(Math.random() * 360),
        round,
        drift: Math.round((Math.random() - 0.5) * 90),
      };
    });
  }, [count]);
  return (
    <div style={{ position: "absolute", inset: 0, overflow: "hidden", pointerEvents: "none", zIndex: 30 }}>
      {pieces.map((p, i) => (
        <span
          key={i}
          style={{
            position: "absolute",
            top: -16,
            left: `${p.left}%`,
            width: p.w,
            height: p.h,
            background: p.color,
            borderRadius: p.round ? "50%" : 2,
            transform: `rotate(${p.rot}deg)`,
            "--drift": `${p.drift}px`,
            animation: `confettiFall ${p.dur}s ${p.delay}s ease-in forwards`,
          }}
        />
      ))}
    </div>
  );
}

  { id: "n15", tier: "normal", cat: "마음", text: "걱정의 대부분은 일어나지 않아요. 오늘은 가볍게 걸어가 봐요." },

  { id: "n17", tier: "normal", cat: "마음", text: "오늘의 기분이 어떻든, 그것도 하루의 일부일 뿐이에요." },
  { id: "n18", tier: "normal", cat: "마음", text: "잘하고 싶은 마음이 큰 만큼 지쳤을 수 있어요. 오늘은 조금 쉬어가요." },
  { id: "n19", tier: "normal", cat: "관계", text: "오늘 건네는 작은 인사가 누군가의 하루를 바꿀 수 있어요." },
  { id: "n20", tier: "normal", cat: "관계", text: "동료의 한마디가 유난히 따뜻한 날이에요. 고마움을 표현해 보세요." },
  { id: "n21", tier: "normal", cat: "관계", text: "모두에게 좋은 사람일 필요는 없어요. 나를 아끼는 사람에게 집중해요." },
  { id: "n22", tier: "normal", cat: "관계", text: "오늘은 안부 문자 하나 보내 보세요. 생각보다 큰 힘이 돼요." },
  { id: "n23", tier: "normal", cat: "성장", text: "어제보다 딱 1%만 나아지면 충분해요. 오늘의 1%를 찾아봐요." },
  { id: "n24", tier: "normal", cat: "휴식", text: "쉬는 것도 일의 일부예요. 오늘 저녁엔 아무것도 안 하는 시간을 허락해 주세요." },
  { id: "n25", tier: "normal", cat: "휴식", text: "퇴근 후 나만의 작은 의식 하나, 오늘의 행운은 거기에 있어요." },
  { id: "n26", tier: "normal", cat: "성장", text: "지금 쌓고 있는 경력은 어디서든 빛나요. 오늘도 한 칸 더 왔어요." },
  { id: "r01", tier: "rare", cat: "행운", text: "오늘은 평소보다 일이 술술 풀리는 날이에요. 미뤄둔 일 하나를 꺼내 보세요." },
  { id: "r02", tier: "rare", cat: "행운", text: "좋은 소식이 가까이 오고 있어요. 전화나 메시지를 놓치지 마세요." },
  { id: "r03", tier: "rare", cat: "행운", text: "오늘 던진 작은 제안이 뜻밖의 기회가 될 수 있어요. 용기 내 말해 봐요." },
  { id: "r04", tier: "rare", cat: "행운", text: "당신을 인정하는 사람이 가까이 있어요. 오늘은 그 마음이 전해질 거예요." },
  { id: "r05", tier: "rare", cat: "행운", text: "뜻밖의 행운이 슬쩍 찾아오는 날. 마음을 열고 하루를 시작해요." },
  { id: "r06", tier: "rare", cat: "행운", text: "오늘 만나는 사람 중 한 명이 좋은 인연이 될 거예요." },
  { id: "s01", tier: "epic", cat: "대행운", text: "오늘은 당신의 날이에요. 무엇을 시작해도 응원하는 기운이 함께해요." },
  { id: "s02", tier: "epic", cat: "대행운", text: "지금까지의 노력이 조용히 빛나기 시작해요. 곧 눈에 보이는 결과로 돌아올 거예요." },
  { id: "s03", tier: "epic", cat: "대행운", text: "오늘 하루, 세상이 당신 편이에요. 하고 싶었던 일에 한 걸음 내디뎌 보세요." },
  { id: "s04", tier: "epic", cat: "대행운", text: "네잎클로버 중에서도 가장 귀한 무지개 클로버! 행운이 두 배로 따라오는 하루예요." },
  { id: "n27", tier: "normal", cat: "월요일", dow: [1], text: "새로운 한 주의 시작, 일주일 전체를 오늘 다 해내려 하지 않아도 돼요." },
  { id: "n28", tier: "normal", cat: "월요일", dow: [1], text: "월요일 아침 커피 한 잔이 오늘의 첫 번째 응원이에요." },
  { id: "n29", tier: "normal", cat: "월요일", dow: [1], text: "월요일은 원래 무거운 날. 그래도 출근한 당신은 이미 충분히 대단해요." },
  { id: "n30", tier: "normal", cat: "월요일", dow: [1], text: "이번 주 목표는 딱 하나만 정해 봐요. 그거면 한 주가 든든해져요." },
  { id: "n31", tier: "normal", cat: "화요일", dow: [2], text: "화요일, 월요일의 관성이 풀리고 리듬이 붙기 시작하는 날이에요." },
  { id: "n32", tier: "normal", cat: "화요일", dow: [2], text: "어제보다 한 발 가벼운 오늘. 미뤄둔 작은 일부터 하나 지워 봐요." },
  { id: "n33", tier: "normal", cat: "화요일", dow: [2], text: "오늘은 조용히 집중하기 좋은 날이에요. 이어폰을 끼고 한 가지에 몰입해 봐요." },
  { id: "n34", tier: "normal", cat: "수요일", dow: [3], text: "수요일엔 퇴근길에 작은 보상 하나. 오늘의 나를 위한 간식은 어떨까요?" },
  { id: "n35", tier: "normal", cat: "수요일", dow: [3], text: "한 주의 한가운데, 잘 오고 있어요. 남은 절반도 지금처럼만 가요." },
  { id: "n36", tier: "normal", cat: "목요일", dow: [4], text: "내일이면 금요일! 오늘만 넘으면 주말의 문이 보여요." },
  { id: "n37", tier: "normal", cat: "목요일", dow: [4], text: "목요일의 피로는 성실하게 달려온 증거예요. 오늘은 일찍 잠자리에 들어 봐요." },
  { id: "n38", tier: "normal", cat: "목요일", dow: [4], text: "마무리가 보이는 목요일, 정리하고 싶은 일 하나만 끝내 봐요." },
  { id: "n39", tier: "normal", cat: "금요일", dow: [5], text: "금요일의 당신, 오늘은 마무리만 잘하면 만점이에요." },
  { id: "n40", tier: "normal", cat: "금요일", dow: [5], text: "주말이 코앞이에요. 오늘 퇴근길엔 발걸음이 조금 가벼울 거예요." },
  { id: "n41", tier: "normal", cat: "금요일", dow: [5], text: "이번 주에 고생한 나에게 오늘 저녁은 조금 특별한 메뉴를 선물해요." },
  { id: "n42", tier: "normal", cat: "금요일", dow: [5], text: "불금이라고 무리하지 않아도 돼요. 푹 쉬는 것도 멋진 주말 계획이에요." },
  { id: "n43", tier: "normal", cat: "토요일", dow: [6], text: "토요일엔 알람 없이 눈뜨는 여유를 누려 봐요." },
  { id: "n44", tier: "normal", cat: "토요일", dow: [6], text: "오늘은 일 생각은 접어두고, 좋아하는 것에만 시간을 써 봐요." },
  { id: "n45", tier: "normal", cat: "토요일", dow: [6], text: "쉬는 날엔 쉬는 게 일이에요. 마음껏 게으름을 부려도 좋아요." },
  { id: "n46", tier: "normal", cat: "일요일", dow: [0], text: "일요일 저녁의 불안은 잠깐 지나가는 구름이에요. 내일의 나도 잘 해낼 거예요." },
  { id: "n47", tier: "normal", cat: "일요일", dow: [0], text: "다음 주를 위한 준비는 푹 자는 것부터예요. 오늘은 일찍 쉬어요." },
  { id: "n48", tier: "normal", cat: "일요일", dow: [0], text: "일요일엔 내일 입을 옷만 미리 골라 두세요. 월요일이 한결 가벼워져요." },
  { id: "n49", tier: "normal", cat: "일", text: "오늘 보낸 메일 한 통이 프로젝트를 앞으로 굴려요. 작은 진전도 진전이에요." },
  { id: "n50", tier: "normal", cat: "일", text: "우선순위 세 가지만 정해 보세요. 나머지는 내일의 내가 챙겨줄 거예요." },
  { id: "n51", tier: "normal", cat: "일", text: "모르는 건 물어보는 게 가장 빠른 길이에요. 오늘은 질문 하나 해 봐요." },
  { id: "n52", tier: "normal", cat: "일", text: "칭찬에는 '감사합니다' 한마디면 충분해요. 오늘 받은 인정은 마음껏 누려요." },
  { id: "n53", tier: "normal", cat: "일", text: "일이 몰릴 땐 한 번에 하나씩. 지금 하는 그 일이 오늘의 전부예요." },
  { id: "n54", tier: "normal", cat: "일", text: "야근보다 중요한 건 내일도 웃으며 출근하는 나예요. 오늘은 제때 퇴근해 봐요." },
  { id: "n55", tier: "normal", cat: "일", text: "피드백이 아프게 느껴져도, 그건 당신이 성장하고 있다는 신호예요." },
  { id: "n56", tier: "normal", cat: "일", text: "오늘 정리한 책상만큼 머릿속도 가벼워질 거예요. 5분만 정리해 볼까요?" },
  { id: "n57", tier: "normal", cat: "일", text: "당신이 만든 결과물에는 당신만의 색이 있어요. 그게 바로 경쟁력이에요." },
  { id: "n58", tier: "normal", cat: "일", text: "회의에서 한마디 하고 싶다면 오늘이 그날이에요. 생각보다 다들 귀 기울여요." },
  { id: "n59", tier: "normal", cat: "일", text: "새로운 업무가 낯설어도 괜찮아요. 처음부터 잘하는 사람은 없어요." },
  { id: "n60", tier: "normal", cat: "일", text: "오늘도 누군가는 당신 덕분에 일이 수월해졌을 거예요." },
  { id: "n61", tier: "normal", cat: "마음", text: "힘든 날은 '오늘은 여기까지'라고 말해도 돼요." },
  { id: "n62", tier: "normal", cat: "마음", text: "비교는 어제의 나와만 해요. 오늘의 나는 어제보다 분명 한 뼘 자랐어요." },
  { id: "n63", tier: "normal", cat: "마음", text: "잠깐 눈을 감고 숨을 세 번만 깊게 쉬어 봐요. 마음이 조금 가라앉아요." },
  { id: "n64", tier: "normal", cat: "마음", text: "지금의 고민도 시간이 지나면 '그땐 그랬지' 하며 웃는 이야기가 돼요." },
  { id: "n65", tier: "normal", cat: "마음", text: "잘 안 풀리는 날도 하루의 한 페이지예요. 내일은 새 페이지가 열려요." },
  { id: "n66", tier: "normal", cat: "마음", text: "오늘은 나를 웃게 하는 작은 것 하나를 꼭 찾아 봐요." },
  { id: "n67", tier: "normal", cat: "마음", text: "완벽하지 않아도 사랑받을 자격이 있어요. 당신은 이미 충분해요." },
  { id: "n68", tier: "normal", cat: "마음", text: "마음이 무거울 땐 물 한 잔 마시고 잠깐 걸어 봐요. 생각보다 큰 위로가 돼요." },
  { id: "n69", tier: "normal", cat: "관계", text: "오늘 하루, 누군가의 이야기를 끝까지 들어주면 그 사람에게 큰 힘이 돼요." },
  { id: "n70", tier: "normal", cat: "관계", text: "고마운 사람에게 '덕분이에요' 한마디 전해 보세요. 그 말이 오래 남아요." },
  { id: "n71", tier: "normal", cat: "관계", text: "의견이 달라도 괜찮아요. 다름은 더 좋은 답을 찾는 과정이에요." },
  { id: "n72", tier: "normal", cat: "관계", text: "오늘 점심은 오랜만에 대화가 잘 통하는 사람과 함께해 보세요." },
  { id: "n73", tier: "normal", cat: "관계", text: "서운한 마음은 마음속에만 두지 말고, 부드럽게 말로 풀어 봐요." },
  { id: "n74", tier: "normal", cat: "관계", text: "당신 곁에는 생각보다 많은 응원군이 있어요. 오늘은 그 마음을 느껴 봐요." },
  { id: "n75", tier: "normal", cat: "관계", text: "사소한 배려 하나가 팀의 분위기를 바꿔요. 오늘은 커피 한 잔 건네 볼까요?" },
  { id: "n76", tier: "normal", cat: "관계", text: "오래 연락 못 한 친구에게 안부를 물어 보세요. 생각보다 반가워할 거예요." },
  { id: "n77", tier: "normal", cat: "성장", text: "새로운 걸 배우는 데 늦은 때는 없어요. 오늘 10분만 투자해 봐요." },
  { id: "n78", tier: "normal", cat: "성장", text: "실패는 결과가 아니라 과정의 일부예요. 그만큼 시도했다는 뜻이니까요." },
  { id: "n79", tier: "normal", cat: "성장", text: "오늘 배운 한 가지를 메모해 두세요. 한 달 뒤엔 든든한 자산이 돼요." },
  { id: "n80", tier: "normal", cat: "성장", text: "지금 하는 고민은 더 나은 선택을 위한 준비 운동이에요." },
  { id: "n81", tier: "normal", cat: "성장", text: "속도보다 방향이에요. 천천히 가도 앞으로 가고 있다면 충분해요." },
  { id: "n82", tier: "normal", cat: "성장", text: "작은 습관 하나가 1년 뒤 큰 차이를 만들어요. 오늘 그 첫걸음을 내디뎌 봐요." },
  { id: "n83", tier: "normal", cat: "성장", text: "당신의 경력은 한 줄 한 줄 쌓이는 이야기예요. 오늘도 좋은 문장을 더했어요." },
  { id: "n84", tier: "normal", cat: "성장", text: "낯선 도전 앞에서 떨리는 건 설렘의 다른 이름이에요." },
  { id: "n85", tier: "normal", cat: "휴식", text: "점심시간엔 밖으로 나가 햇볕을 쬐어 봐요. 오후가 훨씬 가벼워져요." },
  { id: "n86", tier: "normal", cat: "휴식", text: "오늘 저녁엔 좋아하는 음식으로 나를 대접해 주세요." },
  { id: "n87", tier: "normal", cat: "휴식", text: "휴대폰을 잠시 내려놓고 멍하니 있는 시간도 충전이에요." },
  { id: "n88", tier: "normal", cat: "휴식", text: "따뜻한 차 한 잔의 여유가 하루를 다시 설정해 줘요." },
  { id: "n89", tier: "normal", cat: "휴식", text: "잠깐의 스트레칭이 굳은 어깨와 마음을 함께 풀어줘요." },
  { id: "n90", tier: "normal", cat: "휴식", text: "오늘은 일찍 씻고 좋아하는 이불 속에서 푹 쉬어 봐요." },
  { id: "n91", tier: "normal", cat: "휴식", text: "쉬는 시간에 죄책감을 느끼지 않아도 돼요. 충전이 잘 되어야 일도 잘돼요." },
  { id: "n92", tier: "normal", cat: "휴식", text: "오늘의 퇴근길엔 평소와 다른 길로 걸어 보세요. 작은 변화가 기분을 바꿔줘요." },
  { id: "n93", tier: "normal", cat: "휴식", text: "좋아하는 노래를 크게 틀고 오늘 하루를 마무리해 봐요." },
  { id: "n94", tier: "normal", cat: "휴식", text: "주말에 하고 싶은 일을 미리 하나 적어 봐요. 기다리는 설렘이 힘이 돼요." },
  { id: "n95", tier: "normal", cat: "휴식", text: "잠들기 전 '오늘도 수고했어'라고 나에게 말해 주세요." },
  { id: "n96", tier: "normal", cat: "휴식", text: "오늘의 피곤함은 열심히 살았다는 훈장이에요. 푹 자고 내일 또 만나요." },
  { id: "r07", tier: "rare", cat: "행운", text: "오늘은 기다리던 답을 듣게 될 수도 있어요. 마음의 준비를 살짝 해 두세요." },
  { id: "r08", tier: "rare", cat: "행운", text: "우연히 들은 이야기가 좋은 힌트가 되는 날이에요. 귀를 조금만 더 열어 두세요." },
  { id: "r09", tier: "rare", cat: "행운", text: "오늘의 선택은 대체로 옳아요. 직감을 믿고 한 걸음 내디뎌 보세요." },

const LUCKY_BY_ID = LUCKY_MESSAGES.reduce((acc, m) => {
  acc[m.id] = m;
  return acc;
}, {});

// 확률: 네잎클로버 80% · 황금 17% · 무지개 3% / 요일 전용 메시지는 해당 요일에만 / 지금까지 뽑은 적 없는 메시지를 우선
function pickLuckyMessage(draws, todayKey) {
  const r = Math.random();
  const tier = r < 0.03 ? "epic" : r < 0.2 ? "rare" : "normal";
  const dow = parseKey(todayKey).getDay();
  const recent = new Set(
    Object.keys(draws)
      .sort()
      .slice(-7)
      .map((k) => draws[k].id)
  );
  let pool = LUCKY_MESSAGES.filter((m) => m.tier === tier && (!m.dow || m.dow.includes(dow)));
  const seen = new Set(Object.values(draws).map((d) => d.id));
  let fresh = pool.filter((m) => !seen.has(m.id));
  if (!fresh.length) fresh = pool.filter((m) => !recent.has(m.id));
  if (fresh.length) pool = fresh;
  return pool[Math.floor(Math.random() * pool.length)];
}
function calcLuckyStreak(draws, todayKey) {
  let n = 0;
  const cur = parseKey(todayKey);
  if (!draws[dateKeyOf(cur)]) cur.setDate(cur.getDate() - 1);
  while (draws[dateKeyOf(cur)]) {
    n++;
    cur.setDate(cur.getDate() - 1);
  }
  return n;
}

function LuckyCloverCard({ profile, onUpdateProfile }) {
  const [drawing, setDrawing] = useState(false);
  const today = dateKeyOf(new Date());
  const draws = profile.luckyDraws || {};
  const msg = draws[today] ? LUCKY_BY_ID[draws[today].id] : null;
  const tier = msg ? LUCKY_TIERS[msg.tier] : null;
  const streak = calcLuckyStreak(draws, today);
  const monthCount = Object.keys(draws).filter((k) => k.startsWith(today.slice(0, 7))).length;
  const past = Object.keys(draws)
    .filter((k) => k !== today && LUCKY_BY_ID[draws[k].id])
    .sort()
    .reverse()
    .slice(0, 4);

  const draw = () => {
    if (drawing || msg) return;
    setDrawing(true);
    setTimeout(() => {
      const picked = pickLuckyMessage(draws, today);
      const merged = { ...draws, [today]: { id: picked.id } };
      const trimmed = {};
      Object.keys(merged)
        .sort()
        .slice(-200)
        .forEach((k) => {
          trimmed[k] = merged[k];
        });
      onUpdateProfile({ luckyDraws: trimmed });
      setDrawing(false);
    }, 1200);

const SEVERANCE_TYPES = [
  { id: "db", label: "DB형 (확정급여형)" },
  { id: "dc", label: "DC형 (확정기여형)" },
];


// DC형(확정기여형): 근로자퇴직급여보장법상 사용자는 매년 1회 이상,
// 연간 임금총액의 1/12 이상을 근로자의 DC 계좌에 부담금으로 납입해야 함(법정 최소 기준).
// DB형처럼 "퇴사 시점 평균임금"이 아니라, 입사일부터 1년 단위로 해마다 쌓이는 부담금을 계산함.
// 과거 연도에도 현재 급여·상여금 기준을 그대로 적용한 값으로, 실제 급여 인상 이력은 반영하지 못함.
function calcDCDetail({ joinDate, monthlySalary, annualBonus = 0, annualLeavePay = 0, targetDate, overrides = {} }) {
  if (!joinDate || !monthlySalary) return { principal: 0, annualWage: 0, annualContribution: 0, workDays: 0, yearly: [] };

  const start = new Date(joinDate + "T00:00:00");
  const end = targetDate ? new Date(targetDate + "T00:00:00") : new Date();
  const annualWage = monthlySalary * 12 + annualBonus + annualLeavePay;
  const annualContribution = annualWage / 12;
  const workDays = Math.max(0, Math.floor((end - start) / (1000 * 60 * 60 * 24)));

  const yearly = [];
  let principal = 0;
  if (end > start) {
    let cursor = new Date(start);
    let idx = 1;
    while (cursor < end) {
      const next = new Date(cursor);
      next.setFullYear(next.getFullYear() + 1);
      const segEnd = next < end ? next : end;
      const days = Math.max(0, Math.round((segEnd - cursor) / (1000 * 60 * 60 * 24)));
      const auto = annualContribution * (days / 365);
      const hasOverride = overrides[idx] !== undefined && overrides[idx] !== null && overrides[idx] !== "";
      const amount = hasOverride ? Number(overrides[idx]) : auto;
      yearly.push({ year: idx, from: dateKeyOf(cursor), to: dateKeyOf(segEnd), days, amount, auto, overridden: hasOverride });
      principal += amount;
      cursor = next;
      idx++;
    }
  }
  return { principal, annualWage, annualContribution, workDays, yearly };
}

  const years = (workDaysForYears / 365).toFixed(2);
  const investReturn = Number(profile.investReturn) || 0;

            연간 DC 부담금(법정 최소) = 연간 임금총액 ÷ 12

            DC 적립원금 = 입사일부터 1년 단위로, 그해 재직일수만큼 연간 DC 부담금을 비례 계산해 합산

            DC 예상 수령액 = 적립원금 + 누적 운용 수익

            DC형은 회사가 매년 임금의 1/12 이상을 근로자 개인 계좌에 넣어주고, 그 돈을 근로자가 직접 운용해요. DB형과 달리 퇴사 시점 평균임금이 아니라 매년 쌓인 부담금이 기준이에요.

            <br />
            퇴직금 = 1일 평균임금 × 30일 × (재직일수 ÷ 365)
            <br />
            DB형은 회사가 정한 산정 공식대로, 퇴사 시점 평균임금을 기준으로 회사가 직접 지급해요. 재직 중 운용 손익과 무관하게 이 금액이 확정돼요.

        )}

          이전 직장 경력은 캐릭터 성장에만 반영되고, {isDC ? "적립원금" : "퇴직금"}은 현재 회사 재직 기간만 계산해요. 통상임금 기준 계산과는 다를 수 있고, 실제 회사 규정에 따라 달라질 수 있어요.
        </div>
      </div>
    </div>
  );
}

function CurrentJobModal({ onClose, onSubmit, initialCompany, initialJoinDate, careerHistory = [] }) {
  const [company, setCompany] = useState(initialCompany || "");
  const [joinDate, setJoinDate] = useState(initialJoinDate || "");
  const [error, setError] = useState("");
  const canSubmit = company.trim() && joinDate;

  const submit = () => {
    if (!canSubmit) return;
    if (joinDate > dateKeyOf(new Date())) return setError("입사일은 오늘 이전이어야 해요");
    const hit = careerHistory.find((c) => c.endDate >= joinDate);
    if (hit) return setError(`이전 직장 "${hit.company}" 재직 기간(${hit.startDate} ~ ${hit.endDate})과 겹쳐요. 입사일은 그 이후여야 해요`);
    setError("");
    onSubmit({ company: company.trim(), joinDate });
  };

  return (
    <div style={S.modalOverlay}>
      <div style={S.modalSheet}>
        <div style={S.modalHeaderRow}>
          <span style={S.modalTitle}>현재 재직 정보 수정</span>
          <button style={S.iconBtn} onClick={onClose}>
            <X size={16} color="var(--text-secondary)" />
          </button>
        </div>
        <label style={S.label}>회사명</label>
        <input style={S.input} value={company} onChange={(e) => setCompany(e.target.value)} />
        <label style={S.label}>입사일</label>
        <NumericDateInput
          value={joinDate}
          onChange={(v) => {
            setJoinDate(v);
            setError("");
          }}
        />
        <div style={{ fontSize: 10, color: "var(--text-tertiary)", marginTop: 8, lineHeight: 1.5 }}>입사일을 바꾸면 총 경력, 성장 단계, 퇴직금 계산에 바로 반영돼요</div>
        {error && <div style={S.errorText}>⚠️ {error}</div>}
        <button disabled={!canSubmit} style={{ ...S.primaryBtn, opacity: canSubmit ? 1 : 0.4, marginTop: 14 }} onClick={submit}>
          저장
        </button>
      </div>
    </div>
  );
}

function ChapterModal({ onClose, onSubmit, careerHistory = [], currentJoinDate, initial }) {
  const [company, setCompany] = useState(initial ? initial.company : "");
  const [startDate, setStartDate] = useState(initial ? initial.startDate : "");
  const [endDate, setEndDate] = useState(initial ? initial.endDate : "");
  const [overlapError, setOverlapError] = useState("");
  const canSubmit = company && startDate && endDate;

  const rangesOverlap = (aStart, aEnd, bStart, bEnd) => aStart <= bEnd && bStart <= aEnd;

  const handleSubmit = () => {
    if (!canSubmit) return;
    if (startDate > endDate) {
      setOverlapError("퇴사일이 입사일보다 빠를 수 없어요");
      return;
    }
    const hitPast = careerHistory.find((c) => !(initial && c.id === initial.id) && rangesOverlap(startDate, endDate, c.startDate, c.endDate));
    const hitCurrent = currentJoinDate && rangesOverlap(startDate, endDate, currentJoinDate, "9999-12-31");
    if (hitPast || hitCurrent) {
      const label = hitPast ? hitPast.company : "현재 재직 중인 회사";
      setOverlapError(`이미 등록된 "${label}" 재직 기간과 날짜가 겹쳐요`);
      return;
    }
    setOverlapError("");
    onSubmit({ company, startDate, endDate });
  };

  return (
    <div style={S.modalOverlay}>
      <div style={S.modalSheet}>
        <div style={S.modalHeaderRow}>
          <span style={S.modalTitle}>{initial ? "경력 수정" : "이전 직장 추가"}</span>
          <button style={S.iconBtn} onClick={onClose}>
            <X size={16} color="var(--text-secondary)" />
          </button>
        </div>
        <label style={S.label}>회사명</label>
        <input style={S.input} placeholder="예: OO컴퍼니" value={company} onChange={(e) => setCompany(e.target.value)} />
        <label style={S.label}>입사일</label>
        <NumericDateInput value={startDate} onChange={(v) => { setStartDate(v); setOverlapError(""); }} />
        <label style={S.label}>퇴사일</label>
        <NumericDateInput value={endDate} onChange={(v) => { setEndDate(v); setOverlapError(""); }} />
        {overlapError && <div style={S.errorText}>⚠️ {overlapError}</div>}
        <button disabled={!canSubmit} style={{ ...S.primaryBtn, opacity: canSubmit ? 1 : 0.4, marginTop: 16 }} onClick={handleSubmit}>
          저장
        </button>
      </div>
    </div>
  );
}

function DdayModal({ onClose, onSubmit, defaultDate }) {

        <label style={S.label}>날짜</label>

        <label style={S.label}>당일 축하 문구 (선택)</label>

        <button disabled={!canSubmit} style={{ ...S.primaryBtn, opacity: canSubmit ? 1 : 0.4, marginTop: 16 }} onClick={() => onSubmit({ title, date, category, message: message.trim() })}>

        </button>
      </div>
    </div>
  );
}
